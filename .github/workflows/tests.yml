name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light dependencies
        run: pip install numpy scipy opencv-python-headless pyyaml matplotlib pytest
      - name: Run tests
        run: python -m pytest
